    else if (sel.permissionMode === 'plan') args.push('--permission-mode', 'plan');
    else if (sel.permissionMode === 'bypassPermissions') args.push('--dangerously-skip-permissions');
    return args.join(' ');
  }

  function composerHtml(sid) {
    var c = state.config || {};
    var sel = composerDefaults();
    var run = state.activeRun;
    var busy = run && (run.state === 'running' || run.state === 'queued');
    var opts = function (list, selected) {
      return (list || []).map(function (v) { return '<option value="' + esc(v) + '"' + (v === selected ? ' selected' : '') + '>' + esc(v) + '</option>'; }).join('');
    };

    var status = '';
    if (run) {
      if (busy) status = '<span class="composer__status">Running… ' + esc(relativeTime(run.startedAt)) + ' · ' + esc(run.command) + '</span>';
      else if (run.state === 'failed') status = '<span class="composer__status is-error">Failed: ' + esc(run.error || '') + (run.stderr ? '\n' + esc(run.stderr) : '') + '</span>';
      else if (run.state === 'done') status = '<span class="composer__status">Done in ' + esc(run.durationMs === null ? '?' : Math.round(run.durationMs / 1000) + 's') + '.</span>';
    }

    return '<div class="composer">' +
      '<div class="composer__preview" id="cmdPreview">' + esc(commandPreview(sid, sel)) + '</div>' +
      '<textarea id="composerText" placeholder="' + (sid ? 'Reply to this conversation…' : 'Start a new conversation…') + '"' + (busy ? ' disabled' : '') + '>' + esc(composerDraft.text) + '</textarea>' +
      '<div class="composer__controls">' +
        '<label for="cmpModel">Model</label><select class="select" id="cmpModel">' + opts(c.models, sel.model) + '</select>' +
        '<label for="cmpEffort">Effort</label><select class="select" id="cmpEffort">' + opts(c.efforts, sel.effort) + '</select>' +
        '<label for="cmpPerm">Permissions</label><select class="select" id="cmpPerm">' + opts(c.permissionModes, sel.permissionMode) + '</select>' +
        '<span class="grow"></span>' +
        '<button type="button" class="btn btn-primary" id="sendBtn"' + (busy ? ' disabled' : '') + '>' +
          '<svg class="icon' + (busy ? ' spin' : '') + '"><use href="#' + (busy ? 'i-refresh' : 'i-send') + '"/></svg> ' + (busy ? 'Running' : 'Send') + '</button>' +
        status +
      '</div></div>';
  }

  function wireComposer(pid, sid) {
    var textEl = document.getElementById('composerText');
    var preview = document.getElementById('cmdPreview');
    if (!textEl) return;

    var refreshPreview = function () {
      composerDraft.model = document.getElementById('cmpModel').value;
      composerDraft.effort = document.getElementById('cmpEffort').value;
      composerDraft.permissionMode = document.getElementById('cmpPerm').value;
      preview.textContent = commandPreview(sid, composerDefaults());
    };
    ['cmpModel', 'cmpEffort', 'cmpPerm'].forEach(function (id) {
      document.getElementById(id).addEventListener('change', refreshPreview);
    });
    textEl.addEventListener('input', function () { composerDraft.text = textEl.value; });

    var send = function () {
      var message = textEl.value.trim();
      if (!message) return;
      var sel = composerDefaults();
      var url = sid
        ? '/api/projects/' + encodeURIComponent(pid) + '/sessions/' + encodeURIComponent(sid) + '/reply'
        : '/api/projects/' + encodeURIComponent(pid) + '/sessions';
      api(url, { method: 'POST', body: JSON.stringify({ message: message, model: sel.model, effort: sel.effort, permissionMode: sel.permissionMode }) })
        .then(function (run) {
          composerDraft.text = '';
          state.activeRun = run;
          renderCurrentPage();
          pollRun(pid, sid, run.runId);
        })
        .catch(function (err) {
          state.activeRun = { state: 'failed', error: err.message, command: commandPreview(sid, sel), startedAt: Date.now() };
          renderCurrentPage();
        });
    };

    document.getElementById('sendBtn').addEventListener('click', send);
    textEl.addEventListener('keydown', function (e) {
      // Ctrl/Cmd+Enter sends; a bare Enter stays a newline because these prompts
      // are usually several lines long.
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); send(); }
    });
  }

  /* Polls the run every second, and re-reads the transcript every 3 s while it is
     in flight (claude appends to the same .jsonl), plus once on completion. */
  function pollRun(pid, sid, runId) {
    if (timers.run) clearInterval(timers.run);
    if (timers.chat) clearInterval(timers.chat);

    var ticks = 0;
    timers.run = setInterval(function () {
      api('/api/runs/' + encodeURIComponent(runId)).then(function (run) {
        state.activeRun = run;
        if (run.state === 'running' || run.state === 'queued') {
          ticks++;
          if (ticks % 3 === 0 && sid) loadChat(pid, sid).then(renderCurrentPage);
          else renderCurrentPage();
          return;
        }
        clearInterval(timers.run); timers.run = null;
        // A new conversation only learns its session id when the child reports
        // it; hop to that conversation's own route.
        if (!sid && run.resultSessionId) {
          loadSessions(pid).then(function () { location.hash = '#/p/' + pid + '/s/' + run.resultSessionId; });
          return;
        }
        Promise.all([sid ? loadChat(pid, sid) : Promise.resolve(), loadSessions(pid)]).then(renderCurrentPage);
      }).catch(function (err) {
        clearInterval(timers.run); timers.run = null;
        state.activeRun = { state: 'failed', error: err.message, startedAt: Date.now() };
        renderCurrentPage();
      });
    }, 1000);
  }

  /* The one control that opens a window on the machine running the server -
     `claude remote-control --spawn same-dir`, in this project's folder, with
     `--remote-control-session-name-prefix "<computer name> - <folder name>"` so
     the session is identifiable from the phone. Nothing comes back but "it
     launched"; the session itself lives in that terminal. */
  function wireTerminal(pid) {
    var btn = document.getElementById('terminalBtn');
    var status = document.getElementById('terminalStatus');
    if (!btn) return;
    btn.addEventListener('click', function () {
      var label = document.getElementById('terminalBtnLabel');
      btn.disabled = true;
      if (label) label.textContent = 'Opening…';
      var show = function (text, isError) {
        if (!status) return;
        status.hidden = false;
        status.className = 'term-status' + (isError ? ' is-error' : '');
        status.textContent = text;
      };
      api('/api/projects/' + encodeURIComponent(pid) + '/terminal', { method: 'POST' })
        .then(function (r) { show('Terminal opened in ' + r.cwd + ' running: ' + r.command, false); })
        .catch(function (err) { show(err.message, true); })
        .then(function () {
          btn.disabled = false;
          if (label) label.textContent = 'Terminal';
        });
    });
  }

  function wireNewConversation(pid) {
    var btn = document.getElementById('newConvBtn');
    if (!btn) return;
    btn.addEventListener('click', function () { location.hash = '#/p/' + pid + '/s/new'; });
  }

  // ─────────────────────────────────────────────────────────────
  // Conversation page
  // ─────────────────────────────────────────────────────────────
  function loadChat(pid, sid) {
    if (sid === 'new') { state.chat = { sessionId: 'new', messages: [] }; return Promise.resolve(); }
    return api('/api/projects/' + encodeURIComponent(pid) + '/sessions/' + encodeURIComponent(sid))
      .then(function (chat) { state.chat = chat; })
      .catch(function (err) { state.chat = null; state.error = err.message; });
  }

  function renderConversation() {
    var pid = state.route.pid;
    var sid = state.route.sid;
    var isNew = sid === 'new';
    var project = projectOf(pid);
    var data = state.sessions[pid];
    var summary = data ? data.sessions.filter(function (s) { return s.sessionId === sid; })[0] : null;

    var body;
    if (isNew) {
      body = '<div class="card"><div class="card__body">' +
        emptyState('New conversation', 'Type below and send. Work Hub runs claude with this project folder as the working directory, then opens the session it creates.') +
        '</div></div>';
    } else if (state.error && !state.chat) {
      body = errorCard(state.error);
    } else if (!state.chat) {
      body = '<p class="muted">Loading…</p>';
    } else if (state.chat.messages.length === 0) {
      body = '<div class="card"><div class="card__body">' + emptyState('Empty transcript', 'This session file holds no renderable records yet.') + '</div></div>';
    } else {
      body = '<div class="chat">' + state.chat.messages.map(messageHtml).join('') + '</div>';
    }

    setApp(
      '<div class="page-head"><div>' +
        '<h1>' + esc(isNew ? 'New conversation' : (summary ? summary.title : shortId(sid))) + '</h1>' +
        '<p class="mono">' + esc(project ? project.path : '') + (isNew ? '' : ' · ' + esc(shortId(sid))) + '</p></div>' +
        '<a class="btn btn-secondary" href="#/p/' + esc(pid) + '"><svg class="icon"><use href="#i-back"/></svg> ' + esc(project ? project.name : 'Project') + '</a>' +
      '</div>' +
      '<div class="conv-layout">' +
        '<div class="conv-list">' + sessionsCardHtml(pid, sid) + '</div>' +
        '<div class="col gap-4">' + body + composerHtml(isNew ? null : sid) + '</div>' +
      '</div>'
    );
    wireComposer(pid, isNew ? null : sid);
    wireNewConversation(pid);
    wireTerminal(pid);
    wireSessionPager(pid);
    scrollChatToEnd(sid);
  }

  /* A conversation opens at its newest message, the way every chat client does.
     Once open it only auto-follows while the reader is already at the bottom -
     the transcript is re-read every 3 seconds during a run, and yanking someone
     back down mid-scroll would make an in-flight reply unreadable. */
  var chatScroll = { sid: null, count: -1, atEnd: true };

  function scrollerAtEnd() {
    var el = document.scrollingElement || document.documentElement;
    return el.scrollHeight - el.scrollTop - el.clientHeight < 120;
  }

  window.addEventListener('scroll', function () {
    if (state.route.name === 'conversation') chatScroll.atEnd = scrollerAtEnd();
  }, { passive: true });

  function scrollChatToEnd(sid) {
    if (!state.chat || !state.chat.messages || state.chat.messages.length === 0) return;
    var count = state.chat.messages.length;
    var isNewView = chatScroll.sid !== sid;
    var grew = count !== chatScroll.count;
    chatScroll.sid = sid;
    chatScroll.count = count;
    if (!isNewView && !(grew && chatScroll.atEnd)) return;
    // After setApp() the new markup is in the DOM but not laid out yet, so the
    // scrollHeight to jump to does not exist until the next frame.
    requestAnimationFrame(function () {
      var el = document.scrollingElement || document.documentElement;
      el.scrollTop = el.scrollHeight;
      chatScroll.atEnd = true;
    });
  }

  function enterConversation(pid, sid) {
    state.chat = null;
    composerDraft.text = '';
    state.activeRun = null;
    chatScroll = { sid: null, count: -1, atEnd: true };
    snappedSid = null;
    renderCurrentPage();
    Promise.all([
      state.config ? Promise.resolve() : loadConfig(),
      state.dashboard ? Promise.resolve() : loadDashboard(),
      loadSessions(pid),
      loadChat(pid, sid),
    ]).then(renderCurrentPage);
  }

  // ─────────────────────────────────────────────────────────────
  // Job detail dialog
  // ─────────────────────────────────────────────────────────────
  function renderWorkflow(progress) {
    var workflow = (progress && Array.isArray(progress.workflow)) ? progress.workflow : [];
    if (workflow.length === 0) return '<p class="muted">None recorded.</p>';
    return '<div class="wf-track">' + workflow.map(function (step) {
      var isObj = step && typeof step === 'object';
      var name = isObj ? step.step : step;
      var reason = isObj && step.reason ? '<div class="wf-step__reason">' + esc(step.reason) + '</div>' : '';
      return '<div class="wf-step"><div class="wf-step__name">' + esc(name === null || name === undefined ? '(unnamed)' : name) + '</div>' +
        badge(isObj ? step.status : undefined, WORKFLOW_COLORS) + reason + '</div>';
    }).join('<div class="wf-arrow">&#8594;</div>') + '</div>';
  }

  function renderAcTable(progress) {
    var list = (progress && Array.isArray(progress.acceptanceCriteria)) ? progress.acceptanceCriteria : [];
    if (list.length === 0) return '<p class="muted">None recorded.</p>';
    var rows = list.map(function (ac) {
      if (!ac || typeof ac !== 'object') return '';
      var impl = Array.isArray(ac.implementedIn) ? ac.implementedIn.map(esc).join('<br/>') : esc(ac.implementedIn);
      return '<tr><td class="cell-mono">' + esc(ac.id) + '</td><td>' + esc(ac.text) + '</td><td>' + badge(ac.status, AC_COLORS) + '</td>' +
        '<td>' + esc(ac.evidence) + '</td><td class="cell-mono">' + esc(ac.task) + '</td><td class="cell-mono">' + impl + '</td></tr>';
    }).join('');
    return '<div class="table-wrap"><table class="table"><thead><tr><th>ID</th><th>Text</th><th>Status</th><th>Evidence</th><th>Task</th><th>Implemented in</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  function renderTasks(progress) {
    var list = (progress && Array.isArray(progress.tasks)) ? progress.tasks : [];
    if (list.length === 0) return '<p class="muted">None recorded.</p>';
    var rows = list.map(function (t) {
      if (!t || typeof t !== 'object') return '';
      var commits = Array.isArray(t.commits) ? t.commits.join(', ') : '';
      return '<tr><td class="cell-mono">' + esc(t.id) + '</td><td>' + esc(t.title) + '</td><td>' + badge(t.state ?? t.status, TASK_COLORS) + '</td><td class="cell-mono">' + esc(commits) + '</td></tr>';
    }).join('');
    return '<div class="table-wrap"><table class="table"><thead><tr><th>ID</th><th>Title</th><th>State</th><th>Commits</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  function renderTestTier(tier, label) {
    if (!tier || typeof tier !== 'object') return '<div><h4 class="mb-2">' + esc(label) + '</h4><p class="muted">None recorded.</p></div>';
    var cases = Array.isArray(tier.cases) ? tier.cases : [];
    var caseRows = cases.map(function (c) {
      if (!c || typeof c !== 'object') return '';
      return '<tr><td>' + esc(c.name) + '</td><td>' + badge(c.status, CASE_COLORS) + '</td>' +
        '<td class="cell-mono">' + esc(Array.isArray(c.ac) ? c.ac.join(', ') : '') + '</td><td>' + esc(c.message) + '</td></tr>';
    }).join('');
    return '<div><h4 class="row gap-2 mb-2">' + esc(label) + ' ' + badge(tier.status, TIER_COLORS) + '</h4>' +
      (tier.command ? '<div class="cell-mono mb-2">' + esc(tier.command) + '</div>' : '') +
      (cases.length
        ? '<div class="table-wrap"><table class="table"><thead><tr><th>Case</th><th>Status</th><th>AC</th><th>Note</th></tr></thead><tbody>' + caseRows + '</tbody></table></div>'
        : '<p class="muted">No cases recorded.</p>') + '</div>';
  }

  function renderProgressRuns(progress) {
    var runs = (progress && Array.isArray(progress.runs)) ? progress.runs.slice().reverse() : [];
    if (runs.length === 0) return '<p class="muted">None recorded.</p>';
    return runs.map(function (run) {
      if (!run || typeof run !== 'object') return '';
      var agents = Array.isArray(run.agents) ? run.agents : [];
      var agentsHtml = agents.map(function (a) {
        if (!a || typeof a !== 'object') return '';
        var files = Array.isArray(a.files)
          ? '<details><summary>files (' + a.files.length + ')</summary>' + a.files.map(function (f) { return '<div class="cell-mono">' + esc(f) + '</div>'; }).join('') + '</details>'
          : '';
        return '<div class="run-agent"><div><span class="cell-mono">' + esc(a.agent) + '</span> — ' + esc(a.task) +
          ' <span class="muted fs-sm">(AC ' + esc(Array.isArray(a.ac) ? a.ac.join(', ') : '') + ')</span></div>' +
          '<div class="run-agent__outcome">' + esc(a.outcome) + '</div>' +
          (a.flag ? '<div class="run-agent__flag">&#9873; ' + esc(a.flag) + '</div>' : '') + files + '</div>';
      }).join('');
      return '<div class="run-card"><div class="run-head"><span class="cell-mono">round ' + esc(run.round) + '</span>' +
        '<span class="muted">' + esc(run.started) + '</span>' +
        '<span class="cell-mono">tasks: ' + esc(Array.isArray(run.tasks) ? run.tasks.join(', ') : '') + '</span></div>' + agentsHtml + '</div>';
    }).join('');
  }

  function renderIntake(progress) {
    var intake = progress && typeof progress.intake === 'object' ? progress.intake : null;
    if (!intake) return '<p class="muted">None recorded.</p>';
    var brief = intake.brief && typeof intake.brief === 'object' ? intake.brief : null;
    var dup = intake.duplicateCheck && typeof intake.duplicateCheck === 'object' ? intake.duplicateCheck : null;

    var topRows = [['At', intake.at ? esc(intake.at) : '—'], ['Route', intake.route ? esc(intake.route) : '—']];
    if (brief && brief.project) topRows.push(['Project', esc(brief.project)]);
    var topKv = '<div class="kv">' + topRows.map(function (r) {
      return '<div class="kv__row"><span class="kv__key">' + r[0] + '</span><span class="kv__val">' + r[1] + '</span></div>';
    }).join('') + '</div>';

    var briefBody = '<p class="muted">None recorded.</p>';
    if (brief) {
      var unknowns = Array.isArray(brief.unknowns) ? brief.unknowns : [];
      var built = ['what', 'whoWhy', 'signal', 'urgency'].map(function (key) {
        if (!brief[key]) return '';
        var label = key === 'whoWhy' ? 'Who / why' : key.charAt(0).toUpperCase() + key.slice(1);
        return '<div><div class="fs-xs muted mb-2">' + esc(label) + '</div><p>' + esc(brief[key]) + '</p></div>';
      }).join('') + (unknowns.length
        ? '<div><div class="fs-xs muted mb-2">Unknowns</div><ul>' + unknowns.map(function (u) { return '<li>' + esc(u) + '</li>'; }).join('') + '</ul></div>'
        : '');
      if (built) briefBody = built;
    }

    var dupBody = '<p class="muted">None recorded.</p>';
    if (dup) {
      var terms = Array.isArray(dup.terms) ? dup.terms : [];
      var candidates = Array.isArray(dup.candidates) ? dup.candidates : [];
      dupBody = (terms.length
        ? '<div class="row wrap gap-2">' + terms.map(function (t) { return '<span class="badge badge-neutral">' + esc(t) + '</span>'; }).join('') + '</div>'
        : '<p class="muted">No search terms recorded.</p>') +
        (candidates.length
          ? '<div class="table-wrap"><table class="table"><thead><tr><th>ID</th><th>State</th><th>Title</th><th>Verdict</th></tr></thead><tbody>' +
            candidates.map(function (c) {
              if (!c || typeof c !== 'object') return '';
              return '<tr><td class="cell-mono">' + esc(c.id) + '</td><td>' + badge(c.state) + '</td><td>' + esc(c.title) + '</td><td>' + esc(c.verdict) + '</td></tr>';
            }).join('') + '</tbody></table></div>'
          : '<p class="muted">No candidates recorded.</p>');
    }

    var findingsCard = '';
    if (Array.isArray(intake.findings) && intake.findings.length > 0) {
      findingsCard = '<div class="card"><div class="card__head"><div><h3>Findings</h3>' +
        '<p>Not part of the canonical schema - rendered because this job carries it.</p></div></div>' +
        '<div class="card__body"><ul>' + intake.findings.map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('') + '</ul></div></div>';
    }

    return '<div class="col gap-5">' + topKv +
      '<div class="card"><div class="card__head"><div><h3>Brief</h3></div></div><div class="card__body col gap-3">' + briefBody + '</div></div>' +
      '<div class="card"><div class="card__head"><div><h3>Duplicate check</h3></div></div><div class="card__body col gap-3">' + dupBody + '</div></div>' +
      findingsCard + '</div>';
  }

  function listLen(v) { return Array.isArray(v) ? v.length : 0; }

  var DETAIL_TABS = [
    { id: 'ac', label: 'Acceptance Criteria', count: function (job) { return listLen(job.progress && job.progress.acceptanceCriteria); } },
    { id: 'intake', label: 'Intake' },
    { id: 'tasks', label: 'Tasks', count: function (job) { return listLen(job.progress && job.progress.tasks); } },
    { id: 'tests', label: 'Tests', count: function (job) {
        var t = job.progress && job.progress.tests;
        var unit = t && t.unit && Array.isArray(t.unit.cases) ? t.unit.cases.length : 0;
        var ui = t && t.ui && Array.isArray(t.ui.cases) ? t.ui.cases.length : 0;
        return unit + ui;
      } },
    { id: 'runs', label: 'Runs', count: function (job) { return listLen(job.progress && job.progress.runs); } },
    { id: 'docs', label: 'Docs', count: function (job) { return listLen(job.mdFiles); } },
    { id: 'raw', label: 'Raw' },
  ];

  var detailTabsEl = document.getElementById('detailTabs');

  function setActiveTab(id) {
    detailTabsEl.querySelectorAll('.tab').forEach(function (btn) {
      var active = btn.getAttribute('data-tab') === id;
      btn.classList.toggle('is-active', active);
      btn.setAttribute('aria-selected', active ? 'true' : 'false');
      btn.setAttribute('tabindex', active ? '0' : '-1');
    });
    DETAIL_TABS.forEach(function (t) {
      var panel = document.getElementById('panel-' + t.id);
      if (panel) panel.hidden = t.id !== id;
    });
  }

  detailTabsEl.addEventListener('click', function (e) {
    var btn = e.target.closest('.tab');
    if (btn) setActiveTab(btn.getAttribute('data-tab'));
  });
  detailTabsEl.addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    var tabs = Array.prototype.slice.call(detailTabsEl.querySelectorAll('.tab'));
    var idx = tabs.indexOf(document.activeElement);
    if (idx === -1) return;
    e.preventDefault();
    var next = e.key === 'ArrowRight' ? (idx + 1) % tabs.length : (idx - 1 + tabs.length) % tabs.length;
    setActiveTab(tabs[next].getAttribute('data-tab'));
    tabs[next].focus();
  });

  var mdCache = {};
  function loadMdFile(job, file) {
    var container = document.getElementById('mdContent');
    if (!container) return;
    if (Object.prototype.hasOwnProperty.call(mdCache, file)) { container.innerHTML = mdCache[file]; return; }
    container.innerHTML = '<p class="muted">Loading…</p>';
    api('/api/projects/' + encodeURIComponent(job.projectId) + '/jobs/' + encodeURIComponent(job.folder) + '/md/' + encodeURIComponent(file))
      .then(function (html) { mdCache[file] = html; container.innerHTML = html; })
      .catch(function (err) { container.innerHTML = '<p class="muted">Failed to load ' + esc(file) + ': ' + esc(err.message) + '</p>'; });
  }

  var overlay = document.getElementById('detailOverlay');
  var modalEl = overlay.querySelector('.modal');
  var fullscreenBtn = document.getElementById('detailFullscreenBtn');
  var fullscreenIconUse = document.getElementById('fullscreenIconUse');

  function applyFullscreen(on) {
    modalEl.classList.toggle('is-fullscreen', on);
    fullscreenBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    fullscreenBtn.setAttribute('aria-label', on ? 'Restore' : 'Maximise');
    fullscreenBtn.setAttribute('title', on ? 'Restore' : 'Maximise');
    fullscreenIconUse.setAttribute('href', on ? '#i-minimize' : '#i-maximize');
    try { localStorage.setItem(FULLSCREEN_KEY, on ? '1' : '0'); } catch (e) { /* storage blocked */ }
  }
  (function initFullscreen() {
    var stored = false;
    try { stored = localStorage.getItem(FULLSCREEN_KEY) === '1'; } catch (e) { /* default off */ }
    applyFullscreen(stored);
  })();
  fullscreenBtn.addEventListener('click', function () { applyFullscreen(!modalEl.classList.contains('is-fullscreen')); });

  // The job the dialog is currently showing - Resolve acts on this one.
  var currentJob = null;

  function openDetail(job) {
    currentJob = job;
    var idLabel = job.id !== null && job.id !== undefined ? String(job.id) : job.folder;
    document.getElementById('detailIdLabel').textContent = idLabel + ' ';
    document.getElementById('detailTitleId').textContent = job.title || '(untitled)';
    document.getElementById('detailStatusBadge').innerHTML = ' ' + badge(job.status, STATUS_COLORS);
    document.getElementById('detailSubline').textContent = (job.projectName ? job.projectName + ' · ' : '') + job.folder;

    document.getElementById('detailMeta').innerHTML = [
      ['Folder', esc(job.folder)],
      ['Type', esc(job.type) || '—'],
      ['Current step', esc(job.currentStep) || '—'],
      ['AC', esc(acText(job))],
      ['Last activity', esc(relativeTime(job.lastActivity))],
    ].map(function (r) {
      return '<div class="kv__row"><span class="kv__key">' + r[0] + '</span><span class="kv__val">' + r[1] + '</span></div>';
    }).join('');

    document.getElementById('detailWorkflow').innerHTML = renderWorkflow(job.progress);
    document.getElementById('detailAc').innerHTML = renderAcTable(job.progress);
    document.getElementById('detailTasks').innerHTML = renderTasks(job.progress);
    document.getElementById('detailTests').innerHTML =
      renderTestTier(job.progress && job.progress.tests && job.progress.tests.unit, 'Unit') +
      renderTestTier(job.progress && job.progress.tests && job.progress.tests.ui, 'UI');
    document.getElementById('detailRuns').innerHTML = renderProgressRuns(job.progress);
    document.getElementById('detailIntake').innerHTML = renderIntake(job.progress);

    var raw;
    try { raw = JSON.stringify(job.progress, null, 2); } catch (e) { raw = String(job.progress); }
    document.getElementById('detailRaw').textContent = raw || '';

    mdCache = {};
    var files = Array.isArray(job.mdFiles) ? job.mdFiles : [];
    var mdTabs = document.getElementById('mdTabs');
    var mdContent = document.getElementById('mdContent');
    if (files.length === 0) {
      mdTabs.innerHTML = '';
      mdTabs.hidden = true;
      mdContent.innerHTML = '<p class="muted">No markdown files for this job.</p>';
    } else {
      mdTabs.hidden = false;
      mdTabs.innerHTML = files.map(function (f) { return '<button type="button" class="chip" data-file="' + esc(f) + '">' + esc(f) + '</button>'; }).join('');
      var chips = mdTabs.querySelectorAll('.chip');
      chips.forEach(function (btn) {
        btn.addEventListener('click', function () {
          chips.forEach(function (c) { c.classList.remove('is-active'); });
          btn.classList.add('is-active');
          loadMdFile(job, btn.getAttribute('data-file'));
        });
      });
      chips[0].classList.add('is-active');
      loadMdFile(job, chips[0].getAttribute('data-file'));
    }

    detailTabsEl.innerHTML = DETAIL_TABS.map(function (t) {
      var n = typeof t.count === 'function' ? t.count(job) : null;
      return '<button type="button" class="tab' + (n === 0 ? ' is-empty' : '') + '" id="tab-' + t.id + '" role="tab" ' +
        'aria-selected="false" aria-controls="panel-' + t.id + '" tabindex="-1" data-tab="' + t.id + '">' +
        esc(t.label) + (n === null ? '' : ' <span class="badge badge-neutral">' + n + '</span>') + '</button>';
    }).join('');
    setActiveTab('ac');
    setResolveState(job);

    overlay.classList.add('is-open');
    document.getElementById('detailCloseBtn').focus();
  }

  // ── Resolve ────────────────────────────────────────────────────────────────
  // The only action in Work Hub that writes into a monitored folder: it sets
  // every workflow step in the job's own progress.json to done, adding `build`
  // and `human-verification` when the job's workflow never had them. Because it
  // edits a real file in a real repo it takes two clicks, never one.

  var REQUIRED_STEPS = ['build', 'human-verification'];
  var resolveArmed = false;
  var resolveTimer = null;
  var resolveBtn = document.getElementById('detailResolveBtn');
  var resolveLabel = document.getElementById('detailResolveLabel');

  // Mirrors isResolved() in resolve-job.mjs.
  function jobIsResolved(progress) {
    var list = (progress && Array.isArray(progress.workflow) ? progress.workflow : []).filter(function (s) { return s; });
    if (list.length === 0) return false;
    var allDone = list.every(function (s) { return s && typeof s === 'object' && s.status === 'done'; });
    var hasRequired = REQUIRED_STEPS.every(function (step) {
      return list.some(function (s) { return s && typeof s === 'object' && s.step === step; });
    });
    return allDone && hasRequired;
  }

  function disarmResolve() {
    resolveArmed = false;
    if (resolveTimer) { clearTimeout(resolveTimer); resolveTimer = null; }
    resolveBtn.classList.remove('btn-danger');
    resolveBtn.classList.add('btn-secondary');
  }

  function setResolveState(job) {
    disarmResolve();
    if (jobIsResolved(job.progress)) {
      resolveBtn.disabled = true;
      resolveLabel.textContent = 'Resolved';
      resolveBtn.title = 'Every workflow step is already done.';
    } else {
      resolveBtn.disabled = false;
      resolveLabel.textContent = 'Resolve';
      resolveBtn.title = "Mark every workflow step done in this job's progress.json";
    }
  }

  resolveBtn.addEventListener('click', function () {
    if (!currentJob || resolveBtn.disabled) return;

    if (!resolveArmed) {
      resolveArmed = true;
      resolveLabel.textContent = 'Write to progress.json?';
      resolveBtn.classList.remove('btn-secondary');
      resolveBtn.classList.add('btn-danger');
      // Arming lapses on its own, so a stray click never leaves the button
      // sitting one accidental click away from editing a file.
      resolveTimer = setTimeout(function () {
        if (resolveArmed) setResolveState(currentJob);
      }, 4000);
      return;
    }

    disarmResolve();
    resolveBtn.disabled = true;
    resolveLabel.textContent = 'Writing…';
    api('/api/projects/' + encodeURIComponent(currentJob.projectId) + '/jobs/' + encodeURIComponent(currentJob.folder) + '/resolve', { method: 'POST' })
      .then(function () {
        var pid = currentJob.projectId;
        closeDetail();
        // The job changes group, so that project is re-scanned rather than the
        // row patched in place. Only that project - nothing else moved.
        return loadJobs(pid).then(renderCurrentPage);
      })
      .catch(function (err) {
        resolveBtn.disabled = false;
        resolveLabel.textContent = 'Failed - retry';
        resolveBtn.title = err.message;
      });
  });

  function closeDetail() { overlay.classList.remove('is-open'); disarmResolve(); }
  document.getElementById('detailCloseBtn').addEventListener('click', closeDetail);
  overlay.addEventListener('click', function (e) { if (e.target === overlay) closeDetail(); });
  document.addEventListener('keydown', function (e) {
    if (!overlay.classList.contains('is-open')) return;
    if (e.key === 'Escape') { closeDetail(); return; }
    if (e.key === 'f' || e.key === 'F') {
      var tag = document.activeElement && document.activeElement.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
      e.preventDefault();
      applyFullscreen(!modalEl.classList.contains('is-fullscreen'));
    }
  });

  document.getElementById('detailRawCopyBtn').addEventListener('click', function () {
    var text = document.getElementById('detailRaw').textContent || '';
    var iconUse = document.getElementById('detailRawCopyIconUse');
    var btn = document.getElementById('detailRawCopyBtn');
    if (!navigator.clipboard || !navigator.clipboard.writeText) return;
    navigator.clipboard.writeText(text).then(function () {
      iconUse.setAttribute('href', '#i-check');
      btn.setAttribute('title', 'Copied');
      setTimeout(function () { iconUse.setAttribute('href', '#i-copy'); btn.setAttribute('title', 'Copy'); }, 1500);
    }).catch(function () { /* clipboard blocked */ });
  });

  // ─────────────────────────────────────────────────────────────
  // Page dispatch + toolbar
  // ─────────────────────────────────────────────────────────────
  function renderCurrentPage() {
    if (state.route.name === 'dashboard') renderDashboard();
    else if (state.route.name === 'settings') renderSettings();
    else if (state.route.name === 'project') renderProject();
    else if (state.route.name === 'conversation') renderConversation();
  }

  var searchInput = document.getElementById('searchInput');
  searchInput.addEventListener('input', function (e) {
    state.search = e.target.value;
    if (state.route.name === 'dashboard' || state.route.name === 'project') renderCurrentPage();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== searchInput && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) {
      e.preventDefault();
      searchInput.focus();
    }
  });

  document.getElementById('refreshBtn').addEventListener('click', function () {
    var r = state.route;
    if (r.name === 'conversation') {
      Promise.all([loadChat(r.pid, r.sid), loadSessions(r.pid)]).then(renderCurrentPage);
    } else if (r.name === 'project') {
      Promise.all([loadJobs(r.pid), loadSessions(r.pid)]).then(renderCurrentPage);
    } else {
      Promise.all([loadConfig(), loadDashboard(), loadUsage()]).then(renderCurrentPage);
    }
  });

  navigate();
})();
</script>
</body>
</html>
